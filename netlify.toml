[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React Router uses browser-history URLs. Every route without its own file falls back to the app
# shell (app.html). "/" is served by index.html, which carries the prerendered landing page for
# search engines (see frontend/scripts/prerender.mjs), as are robots.txt and sitemap.xml.
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
